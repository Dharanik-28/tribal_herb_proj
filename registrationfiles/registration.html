<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Registration | TribalHerb</title>

    <link rel="stylesheet" href="registration.css">
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;

    min-height: 100vh;

    background: #eaf3e5;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}


/* Main container */

.registration-container {

    width: 100%;
    max-width: 1100px;

    display: grid;
    grid-template-columns: 45% 55%;

    background: white;

    border-radius: 25px;

    overflow: hidden;

    box-shadow: 0 15px 45px rgba(0,0,0,0.15);
}


/* Image */

.registration-image {

    min-height: 700px;

    background:
        linear-gradient(
            rgba(25,80,40,0.65),
            rgba(25,80,40,0.65)
        ),
        url("https://loremflickr.com/900/1200/farmer,india")
        center/cover;

    display: flex;

    align-items: flex-end;

    padding: 45px;

    color: white;
}


.image-content h1 {

    color: #f2c14e;

    font-size: 30px;

    margin-bottom: 20px;
}


.image-content h2 {

    font-size: 40px;

    line-height: 1.2;

    margin-bottom: 15px;
}


.image-content p {

    font-size: 17px;

    line-height: 1.7;
}


/* Form */

.registration-form {

    padding: 45px;
}


.registration-form h1 {

    color: #245c34;

    font-size: 32px;
}


.subtitle {

    color: #777;

    margin: 8px 0 25px;
}


/* Labels */

label {

    display: block;

    margin-top: 15px;
    margin-bottom: 7px;

    font-weight: bold;

    color: #34523c;
}


/* Inputs */

input,
select {

    width: 100%;

    padding: 13px 15px;

    border: 1px solid #d5ddd3;

    border-radius: 8px;

    outline: none;

    font-size: 15px;

    background: #fbfdf9;
}


input:focus,
select:focus {

    border-color: #3d824e;

    box-shadow:
        0 0 0 3px rgba(61,130,78,0.1);
}


/* Checkbox */

.terms {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 20px 0;

    color: #666;
}


.terms input {

    width: auto;
}


/* Button */

button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 9px;

    background: #2e7541;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}


button:hover {

    background: #205a30;

    transform: translateY(-2px);

}


/* Message */

#message {

    margin-top: 20px;

    text-align: center;

    font-weight: bold;

}


/* Mobile */

@media(max-width:800px) {

    .registration-container {

        grid-template-columns: 1fr;
    }

    .registration-image {

        min-height: 300px;

    }

    .registration-form {

        padding: 30px;
    }

}


@media(max-width:500px) {

    body {

        padding: 10px;
    }

    .registration-form {

        padding: 25px 20px;
    }

    .image-content h2 {

        font-size: 28px;
    }

}




</style>

<body>
 <nav class="navlinks"><a class="" href="/index/index.html">Home</a>
    <div class="registration-container">

        <div class="registration-image">
            <div class="image-content">
                <h1>🌿 TribalHerb</h1>

                <h2>Join Our Herbal Farmer Community</h2>

                <p>
                    Register your farm and showcase your
                    medicinal plants and herbal products.
                </p>
            </div>
        </div>


        <div class="registration-form">

            <h1>Farmer Registration</h1>

            <p class="subtitle">
                Create your farmer profile
            </p>


            <form id="farmerForm">

                <!-- Name -->

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <!-- Mobile -->

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required
                >


                <!-- Email -->

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Village -->

                <label>Village</label>

                <input
                    type="text"
                    id="village"
                    placeholder="Enter village name"
                    required
                >


                <!-- Region -->

                <label>Region</label>

                <select id="region" required>

                    <option value="">
                        Select your region
                    </option>

                    <option value="Araku">
                        Araku
                    </option>

                    <option value="Chintapalli">
                        Chintapalli
                    </option>

                    <option value="Paderu">
                        Paderu
                    </option>

                </select>


                <!-- Farm -->

                <label>Farm Name</label>

                <input
                    type="text"
                    id="farm"
                    placeholder="Enter your farm name"
                    required
                >


                <!-- Plants -->

                <label>Medicinal Plants</label>

                <input
                    type="text"
                    id="plants"
                    placeholder="Example: Tulsi, Turmeric, Amla"
                    required
                >


                <!-- Experience -->

                <label>Farming Experience</label>

                <select id="experience" required>

                    <option value="">
                        Select experience
                    </option>

                    <option value="0-2 Years">
                        0 - 2 Years
                    </option>

                    <option value="3-5 Years">
                        3 - 5 Years
                    </option>

                    <option value="6-10 Years">
                        6 - 10 Years
                    </option>

                    <option value="10+ Years">
                        10+ Years
                    </option>

                </select>


                <!-- Terms -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the registration terms.
                    </span>

                </div>


                <button type="submit">
                    Register Now 🌿
                </button>

            </form>


            <p id="message"></p>

        </div>

    </div>


    <script >const form = document.getElementById("farmerForm");

const message = document.getElementById("message");


form.addEventListener("submit", function(event) {

    event.preventDefault();


    // Get values

    const name =
        document.getElementById("name").value;

    const phone =
        document.getElementById("phone").value;

    const email =
        document.getElementById("email").value;

    const village =
        document.getElementById("village").value;

    const region =
        document.getElementById("region").value;

    const farm =
        document.getElementById("farm").value;

    const plants =
        document.getElementById("plants").value;

    const experience =
        document.getElementById("experience").value;


    // Mobile validation

    if (!/^[0-9]{10}$/.test(phone)) {

        message.innerText =
            "❌ Please enter a valid 10 digit mobile number.";

        message.style.color = "red";

        return;
    }


    // Farmer object

    const farmer = {

        name: name,

        phone: phone,

        email: email,

        village: village,

        region: region,

        farm: farm,

        plants: plants,

        experience: experience

    };


    // Get old farmers

    let farmers =
        JSON.parse(
            localStorage.getItem("tribalHerbFarmers")
        ) || [];


    // Add new farmer

    farmers.push(farmer);


    // Save in browser

    localStorage.setItem(
        "tribalHerbFarmers",
        JSON.stringify(farmers)
    );


    // Success message

    message.innerText =
        "✅ Registration successful! Welcome to TribalHerb 🌿";

    message.style.color = "green";


    // Clear form

    form.reset();

});</script>

</body>

</html>
